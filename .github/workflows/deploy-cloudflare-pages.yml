name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rake-lang.org
      - name: Check out the compiler and documentation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rakelang/rake
          ref: main
          path: rake
      - name: Check out the Tree-sitter grammar
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rakelang/tree-sitter-rake
          ref: main
          path: tree-sitter-rake
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build and check the published site
        working-directory: rake-lang.org
        env:
          RAKE_DIR: ${{ github.workspace }}/rake
          RAKE_BRANCH: main
          TREE_SITTER_RAKE_DIR: ${{ github.workspace }}/tree-sitter-rake
        run: |
          bash tools/build.sh build
          bash tools/build.sh check
      - name: Keep Cloudflare as the single analytics owner
        run: |
          if grep -R -n -E 'static\.cloudflareinsights\.com/beacon\.min\.js|data-cf-beacon' rake-lang.org/public --include='*.html'; then
            echo 'Cloudflare injects analytics. Remove manual beacons from the site.' >&2
            exit 1
          fi
      - name: Deploy the checked build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix run --inputs-from rake-lang.org nixpkgs#wrangler -- pages deploy rake-lang.org/public --project-name=rake-lang --branch=main
