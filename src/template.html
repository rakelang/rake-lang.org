<!DOCTYPE html>
<html lang="en">
<head>

  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  {{robots}}<link rel="canonical" href="{{canonical}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="{{asset:styles/tokens.css}}">
  <link rel="stylesheet" href="{{asset:styles/components.css}}">

    <nav class="site-nav" aria-label="Site">
      <a href="/docs/">Documentation</a>

      <a href="{{github}}">GitHub</a>
    </nav>

    {{sidebar}}
    <main class="content">
{{body}}
    </main>
    {{contents}}
  </div>
  <footer class="site-footer">
    <p>Rake {{version}}. MIT licence. Source on <a href="{{github}}">GitHub</a>. A research project by <a href="https://over-yonder.tech/">over|yonder</a>.</p>
